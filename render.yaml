# Render Blueprint for the TrustLayer API (FastAPI).
# Deploy: render.com -> New -> Blueprint -> connect this repo.
# Secret values (keys, DB URL) are marked sync:false -> set them in the dashboard.
services:
  - type: web
    name: trustlayer-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # --- non-secret config (safe to commit) ---
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3-flash-preview,gemini-3.5-flash,gemini-2.0-flash
      - key: GEMINI_MAX_RPM
        value: "5"
      - key: FREE_TIER_DAILY_LIMIT
        value: "10"
      # --- TrustLayer 2.0 verification (see .env.example for every option) ---
      # Public contact for the crawler User-Agent (Wikimedia requires one).
      - key: TRUSTLAYER_CONTACT
        value: https://github.com/SourishAFK/TrustLayer
      - key: TRUSTLAYER_LLM_PROVIDERS
        value: anthropic,gemini
      - key: TRUSTLAYER_MAX_CONCURRENT_VERIFICATIONS
        value: "4"
      - key: TRUSTLAYER_REPORT_RETENTION_HOURS
        value: "0"
      # --- website: sign-ups and the live demo (see .env.example) ---
      # Turn the demo on once a paid model key is set; free-tier keys run out within a day.
      - key: TRUSTLAYER_PUBLIC_DEMO
        value: "false"
      - key: TRUSTLAYER_DEMO_DAILY_LIMIT
        value: "50"
      - key: TRUSTLAYER_IP_SALT
        generateValue: true
      # --- secrets: set these in the Render dashboard (sync:false) ---
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: GEMINI_API_KEY_4
        sync: false
      - key: DATABASE_URL
        sync: false

  # The website (frontend/site): static pages that call the API above.
  - type: web
    name: trustlayer-site
    runtime: static
    buildCommand: cd frontend/site && npm ci && npm run build
    staticPublishPath: frontend/site/dist
    envVars:
      # The API's public URL, e.g. https://trustlayer-api.onrender.com (read at build time).
      - key: VITE_API_BASE
        sync: false
      # The site's own public URL, for link previews on LinkedIn, X and WhatsApp.
      - key: SITE_URL
        sync: false
